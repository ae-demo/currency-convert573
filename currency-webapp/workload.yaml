apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: currency-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: currency-convert573-currency-api
      name: http
      visibility: project
      envBindings:
        address: CURRENCY_API_URL
  resources:
    - ref: currency-convert5-daf943e0
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
